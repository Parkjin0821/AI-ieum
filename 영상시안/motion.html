<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>김장대전 모션그래픽 시안 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#1E1716;color:#eee;font:14px/1.5 "Noto Sans KR",sans-serif;display:grid;gap:12px;justify-items:center;padding:16px}
  canvas{width:270px;height:480px;border-radius:12px;background:#000}
  #st{font-weight:700}
</style></head><body>
<p id="st">준비 중…</p>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
/* 2026 빛고을 사랑나눔 김장대전 — 30초 모션그래픽 시안 v3 (시나리오: docs/김장대전-영상기획.md 4장)
   디자인: 배추속 크림 바탕 + 고춧가루 빨강 · 배춧잎 초록 · 참깨 노랑, 굵은 제목체(Black Han Sans)
   모션: 글자 튀어나오기 · 사진 카드 미끄러지기 · 장면 사이 색 띠 쓸기 · 숫자 올라가기 · 스티커 찍기
   사진은 위키미디어 공용(김장 일반 장면, 이 행사 사진 아님) — 제출본은 현장 촬영·관광공사 사진으로 교체
   ?br=3200000&suffix=_폰 → 폰·웹 공유용 가벼운 파일 */
import { Muxer, ArrayBufferTarget } from "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm";

const Q = new URLSearchParams(location.search), BR = +Q.get("br") || 7e6;
const W = 1080, H = 1920, FPS = 30, DUR = 30, NAME = "김장대전_모션_v3" + (Q.get("suffix") || "");
const st = document.getElementById("st"), say = t => { st.textContent = t; window.__status = t; };
const cv = document.getElementById("c"), g = cv.getContext("2d");

/* 색 · 글꼴 */
const K = { cream: "#F6EFDF", paper: "#FFFDF7", ink: "#231A18", sub: "#6B5E57", red: "#C8281E", redD: "#8E1A13", yellow: "#FFC93C", green: "#5E8F32", greenL: "#DCEBC6" };
const DISP = "'Black Han Sans'", BODY = "'Noto Sans KR'";

/* 사진 (위키미디어 공용) */
const C = "https://upload.wikimedia.org/wikipedia/commons/thumb/";
const P = {
  prep:  { f: "f/f8/Korean_cuisine-Gimjang-Preparation_for_making_kimchi-01.jpg", by: "Caroline Knox", lic: "CC BY-SA 3.0" },
  salted:{ f: "f/ff/Korean_cuisine-Salted_baechu-01.jpg", by: "Joseph Steinberg", lic: "CC BY-SA 2.0" },
  mix:   { f: "e/eb/Gimjang_in_Gaemi_Village%2C_1_December_2012.jpg", by: "USAG-Humphreys", lic: "CC BY 2.0" },
  mix2:  { f: "e/e9/Gimjang_in_Gaemi_Village%2C_1_December_2012_2.jpg", by: "USAG-Humphreys", lic: "CC BY 2.0" },
  kimchi:{ f: "0/04/Baechu-gimchi.jpg", by: "gwangju kimchi", lic: "CC BY-SA 2.0" },
  suyuk: { f: "c/c4/Korea-Gangneung-Suyuk-Steamed_pork-01.jpg", by: "Junho Jung", lic: "CC BY-SA 3.0" },
  box:   { f: "5/5b/Kimchi_Making_Event_%289391050%29.jpg", by: "Galen Putnam, U.S. Army", lic: "퍼블릭 도메인" },
};
const imgs = {};
const load = k => new Promise((ok, no) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => ok(imgs[k] = i); i.onerror = () => no(new Error("사진 못 받음: " + k)); i.src = `${C}${P[k].f}/960px-${P[k].f.split("/").pop()}`; });

/* 움직임 도우미 */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, s, d) => cl((t - s) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const won = n => Math.round(n).toLocaleString("ko-KR");

function rr(x, y, w, h, r){ g.beginPath(); g.roundRect(x, y, w, h, r); }
/* 사진 카드: 가운데 기준으로 움직이고 돌리고, 둥근 모서리로 자르고, 그림자 */
function card(k, cx, cy, w, h, { r = 36, rot = 0, zoom = 1, a = 1, sc = 1, shadow = true, border = 0 } = {}){
  if (a <= 0 || sc <= 0) return; const img = imgs[k];
  g.save(); g.globalAlpha *= a; g.translate(cx, cy); g.rotate(rot * Math.PI / 180); g.scale(sc, sc);
  if (shadow){ g.save(); g.shadowColor = "rgba(60,25,15,.28)"; g.shadowBlur = 40; g.shadowOffsetY = 18; rr(-w / 2, -h / 2, w, h, r); g.fillStyle = K.paper; g.fill(); g.restore(); }
  if (border){ rr(-w / 2 - border, -h / 2 - border, w + border * 2, h + border * 2, r + border); g.fillStyle = K.paper; g.fill(); }
  rr(-w / 2, -h / 2, w, h, r); g.clip();
  const s = Math.max(w / img.width, h / img.height) * zoom; g.drawImage(img, -img.width * s / 2, -img.height * s / 2, img.width * s, img.height * s);
  g.restore();
}
function circlePhoto(k, cx, cy, rad, zoom, a = 1){
  if (rad <= 0) return; const img = imgs[k]; g.save(); g.globalAlpha *= a; g.beginPath(); g.arc(cx, cy, rad, 0, Math.PI * 2); g.clip();
  const s = Math.max(rad * 2 / img.width, rad * 2 / img.height) * zoom; g.drawImage(img, cx - img.width * s / 2, cy - img.height * s / 2, img.width * s, img.height * s); g.restore();
}
/* 글자: 앵커 기준 확대/이동/투명도 */
function T(text, x, y, { size = 60, font = BODY, w = 700, color = K.ink, align = "left", a = 1, sc = 1, dy = 0, ls = 0, rot = 0 } = {}){
  if (a <= 0 || sc <= 0) return;
  g.save(); g.globalAlpha *= a; g.translate(x, y + dy); g.rotate(rot * Math.PI / 180); g.scale(sc, sc);
  g.font = `${font === DISP ? "" : w + " "}${size}px ${font}`; g.textAlign = align; g.letterSpacing = ls + "px"; g.fillStyle = color; g.fillText(text, 0, 0);
  g.restore();
}
const width = (text, size, font = BODY, w = 700) => { g.font = `${font === DISP ? "" : w + " "}${size}px ${font}`; g.letterSpacing = "0px"; return g.measureText(text).width; };
/* 단어 뒤 형광펜 쓸기 */
function marker(x, y, w, h, p, color = K.yellow){ if (p <= 0) return; g.save(); g.fillStyle = color; g.beginPath(); g.roundRect(x, y, w * eo(p), h, 10); g.fill(); g.restore(); }
/* 둥근 알약 스티커 */
function pill(text, cx, cy, { size = 40, bg = K.red, fg = "#fff", sc = 1, rot = 0, a = 1, padX = 34, h } = {}){
  if (sc <= 0 || a <= 0) return; const tw = width(text, size, BODY, 700) + padX * 2, hh = h || size * 1.9;
  g.save(); g.globalAlpha *= a; g.translate(cx, cy); g.rotate(rot * Math.PI / 180); g.scale(sc, sc);
  g.shadowColor = "rgba(60,25,15,.22)"; g.shadowBlur = 16; g.shadowOffsetY = 6; rr(-tw / 2, -hh / 2, tw, hh, hh / 2); g.fillStyle = bg; g.fill(); g.shadowColor = "transparent";
  g.font = `700 ${size}px ${BODY}`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = fg; g.fillText(text, 0, 2); g.restore();
}
/* 도장: 원 두 겹 + 가운데 글자 */
function stamp(cx, cy, rad, top, mid, sc, rot){
  if (sc <= 0) return; g.save(); g.translate(cx, cy); g.rotate(rot * Math.PI / 180); g.scale(sc, sc);
  g.beginPath(); g.arc(0, 0, rad, 0, Math.PI * 2); g.fillStyle = K.red; g.fill();
  g.lineWidth = 5; g.strokeStyle = "rgba(255,255,255,.85)"; g.beginPath(); g.arc(0, 0, rad - 16, 0, Math.PI * 2); g.stroke();
  g.textAlign = "center"; g.fillStyle = "#fff"; g.font = `700 30px ${BODY}`; g.fillText(top, 0, -18); g.font = `64px ${DISP}`; g.fillText(mid, 0, 52); g.restore();
}
/* 붓 밑줄 */
function brush(x, y, w, p, color = K.red){ if (p <= 0) return; g.save(); g.strokeStyle = color; g.lineWidth = 22; g.lineCap = "round"; g.beginPath();
  const n = 40, e = eo(p); for (let i = 0; i <= n * e; i++){ const u = i / n; const px = x + w * u, py = y + Math.sin(u * Math.PI * 2.2) * 9; i ? g.lineTo(px, py) : g.moveTo(px, py); } g.stroke(); g.restore(); }

/* 공통 틀: 크림 바탕 · 위 진행 띠 · 시안 표시 · 사진 출처 */
const CUTS = [0, 3, 7, 12, 16, 21, 25, 30];
function frameBase(t, credit){
  g.fillStyle = K.cream; g.fillRect(0, 0, W, H);
  // 바탕에 큰 배춧잎 모양이 천천히 도는 무늬
  g.save(); g.globalAlpha = .07; g.fillStyle = K.green; g.translate(980, 1700); g.rotate(t * .05);
  g.beginPath(); g.ellipse(0, 0, 360, 170, -.5, 0, Math.PI * 2); g.fill(); g.restore();
  g.save(); g.globalAlpha = .06; g.fillStyle = K.red; g.translate(80, 240); g.rotate(-t * .04);
  g.beginPath(); g.ellipse(0, 0, 300, 120, .4, 0, Math.PI * 2); g.fill(); g.restore();
  // 진행 띠 (장면 7칸)
  const sw = (W - 120 - 6 * 10) / 7;
  for (let i = 0; i < 7; i++){ const x = 60 + i * (sw + 10); rr(x, 64, sw, 8, 4); g.fillStyle = "rgba(35,26,24,.14)"; g.fill();
    const f = cl((t - CUTS[i]) / (CUTS[i + 1] - CUTS[i])); if (f > 0){ rr(x, 64, sw * f, 8, 4); g.fillStyle = K.red; g.fill(); } }
  pill("시안", 112, 132, { size: 26, bg: K.ink, fg: K.yellow, padX: 22, h: 46 });
  T("빛고을 김장대전 · 참고 사진(김장 일반)", 168, 141, { size: 26, w: 500, color: K.sub });
  if (credit){ const p = P[credit]; T(`사진: ${p.by} · ${p.lic} · Wikimedia Commons`, 60, 1660, { size: 22, w: 500, color: "rgba(35,26,24,.55)" }); }
}

/* ---------- 장면 ---------- */
// 1. 0–3초 · 공감: 올해 김장, 또 혼자?
function s1(t){
  frameBase(t + 0, "prep");
  const c = eo(pr(t, 0, .7));
  card("prep", 540, lerp(900, 700, c), 900, 760, { rot: lerp(-6, -2, c), zoom: lerp(1.15, 1.05, pr(t, 0, 3)), a: c });
  stamp(860, 360, 120, "배추", "100포기", back(pr(t, .45, .5)), -12);
  T("올해 김장,", 64, 1250, { size: 104, font: DISP, a: eo(pr(t, .3, .4)), dy: 40 * (1 - eo(pr(t, .3, .4))) });
  const q = pr(t, .65, .4), shake = t > .9 && t < 1.25 ? Math.sin(t * 90) * 6 : 0;
  const x0 = 64 + shake; T("또", x0, 1380, { size: 104, font: DISP, a: eo(q), dy: 40 * (1 - eo(q)) });
  const w1 = width("또 ", 104, DISP); marker(x0 + w1 - 8, 1300, width("혼자", 104, DISP) + 16, 104, pr(t, .85, .35));
  T("혼자", x0 + w1, 1380, { size: 104, font: DISP, color: K.red, a: eo(q), dy: 40 * (1 - eo(q)) });
  T("하실 거예요?", x0 + w1 + width("혼자 ", 104, DISP), 1380, { size: 104, font: DISP, a: eo(q), dy: 40 * (1 - eo(q)) });
  // 고생 목록: 하나씩 튀어나오고 줄이 그어짐
  ["절이고", "씻고", "양념까지"].forEach((s, i) => { const x = 64 + i * 250, sc = back(pr(t, 1.15 + i * .18, .4));
    if (sc <= 0) return; g.save(); g.translate(x, 1470); g.scale(sc, sc); const tw = width(s, 44) + 50; rr(0, 0, tw, 78, 39); g.fillStyle = K.paper; g.fill(); g.lineWidth = 3; g.strokeStyle = "rgba(35,26,24,.18)"; g.stroke();
      g.font = `700 44px ${BODY}`; g.fillStyle = K.sub; g.textAlign = "left"; g.fillText(s, 25, 54);
      const sp = eo(pr(t, 2 + i * .15, .3)); if (sp > 0){ g.strokeStyle = K.red; g.lineWidth = 6; g.lineCap = "round"; g.beginPath(); g.moveTo(18, 40); g.lineTo(18 + (tw - 36) * sp, 40); g.stroke(); }
      g.restore(); });
}
// 2. 3–7초 · 반전: 광주에선 비비기만
function s2(t){
  frameBase(t + 3, "salted");
  const r = lerp(0, 380, back(pr(t, .05, .6)));
  g.save(); g.beginPath(); g.arc(540, 660, r + 18, 0, Math.PI * 2); g.fillStyle = K.red; g.fill(); g.restore();
  circlePhoto("salted", 540, 660, r, lerp(1.25, 1.05, pr(t, 0, 4)));
  ["✓ 절임배추", "✓ 양념"].forEach((s, i) => pill(s, 400 + i * 290, 1060, { size: 40, bg: K.green, sc: back(pr(t, 1.3 + i * .2, .4)), rot: i ? 4 : -4 }));
  T("광주에선", 64, 1230, { size: 58, w: 900, color: K.sub, a: eo(pr(t, .3, .3)) });
  const p = pr(t, .5, .45), bw = width("비비기만", 176, DISP);
  marker(56, 1262, bw + 24, 150, pr(t, .8, .4));
  T("비비기만", 64, 1400, { size: 176, font: DISP, color: K.red, sc: lerp(.6, 1, back(p)), a: eo(p) });
  T("하면 끝!", 64, 1528, { size: 104, font: DISP, a: eo(pr(t, 1.05, .35)), dy: 30 * (1 - eo(pr(t, 1.05, .35))) });
}
// 3. 7–12초 · 가족: 함께 쓱쓱
function s3(t){
  frameBase(t + 7, "mix");
  const a = eo(pr(t, 0, .6)), b = eo(pr(t, .15, .6));
  card("mix", lerp(-300, 300, a), 720, 470, 820, { rot: -4, zoom: lerp(1.2, 1.05, pr(t, 0, 5)), border: 12 });
  card("mix2", lerp(1380, 780, b), 780, 470, 820, { rot: 4, zoom: lerp(1.05, 1.2, pr(t, 0, 5)), border: 12 });
  pill("🎥 현장 촬영 필요 · 아이가 처음 버무리는 컷", 540, 1200, { size: 32, bg: K.yellow, fg: K.ink, sc: back(pr(t, .9, .4)), rot: -2 });
  T("온 가족이 함께", 64, 1360, { size: 96, font: DISP, a: eo(pr(t, .45, .4)), dy: 34 * (1 - eo(pr(t, .45, .4))) });
  const p = pr(t, .8, .4); T("쓱쓱", 64, 1540, { size: 190, font: DISP, color: K.red, sc: lerp(.5, 1, back(p)), a: eo(p), rot: lerp(-8, -3, eo(p)) });
  brush(70, 1580, 330, pr(t, 1.2, .6));
  T("아이도 장갑 끼고 한 포기", 430, 1500, { size: 46, w: 700, color: K.sub, a: eo(pr(t, 1.5, .4)) });
}
// 4. 12–16초 · 믿음: 세계김치연구소 레시피 · 1만 8천 명
function s4(t){
  frameBase(t + 12, "kimchi");
  const c = eo(pr(t, 0, .6));
  card("kimchi", 540, lerp(820, 700, c), 940, 820, { zoom: lerp(1.25, 1.08, pr(t, 0, 4)), a: c });
  stamp(850, 360, 140, "세계김치연구소", "레시피", back(pr(t, .9, .5)), lerp(-30, -10, eo(pr(t, .9, .6))));
  T("세계김치연구소", 64, 1300, { size: 92, font: DISP, a: eo(pr(t, .3, .35)), dy: 30 * (1 - eo(pr(t, .3, .35))) });
  T("레시피 그대로", 64, 1430, { size: 120, font: DISP, color: K.red, a: eo(pr(t, .55, .35)), sc: lerp(.8, 1, back(pr(t, .55, .5))) });
  const n = lerp(0, 18000, eio(pr(t, 1.1, 1.3)));
  T("지난해", 64, 1560, { size: 50, w: 700, color: K.sub, a: eo(pr(t, 1, .3)) });
  T(won(n) + "명", 250, 1566, { size: 78, font: DISP, color: K.green, a: eo(pr(t, 1, .3)) });
  T("이 찾았어요", 250 + width("18,000명", 78, DISP) + 14, 1560, { size: 50, w: 700, color: K.sub, a: eo(pr(t, 2.3, .3)) });
}
// 5. 16–21초 · 보상: 김치에 수육 한 점
function s5(t){
  frameBase(t + 16, "suyuk");
  const c = eo(pr(t, 0, .6));
  card("suyuk", 540, 720, lerp(700, 960, c), lerp(600, 880, c), { zoom: lerp(1.3, 1.08, pr(t, 0, 5)), a: c });
  // 김 모락모락
  g.save(); g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 10; g.lineCap = "round";
  for (let k = 0; k < 3; k++){ const ph = (t * .9 + k * .33) % 1, x = 420 + k * 120; g.globalAlpha = Math.sin(ph * Math.PI) * cl(t - .6); g.beginPath();
    for (let i = 0; i <= 20; i++){ const u = i / 20, y = 640 - ph * 180 - u * 160; g.lineTo(x + Math.sin(u * 6 + t * 3 + k) * 16, y); } g.stroke(); } g.restore();
  pill("🎥 있으면 최고 · 아이가 한 입 먹는 컷", 540, 300, { size: 32, bg: K.yellow, fg: K.ink, sc: back(pr(t, 1.6, .4)), rot: 2 });
  T("갓 버무린 김치에", 64, 1350, { size: 84, font: DISP, a: eo(pr(t, .4, .35)), dy: 30 * (1 - eo(pr(t, .4, .35))) });
  const p = pr(t, .75, .45); T("수육 한 점", 64, 1520, { size: 160, font: DISP, color: K.red, sc: lerp(.6, 1, back(p)), a: eo(p) });
  pill("이 맛에 김장하죠 😋", 800, 1200, { size: 40, bg: K.green, sc: back(pr(t, 1.3, .45)), rot: -6 });
}
// 6. 21–25초 · 방법·가격: 카드 세 장 + 숫자 올라가기
function s6(t){
  frameBase(t + 21, "box");
  T("직접 버무리기부터", 64, 300, { size: 84, font: DISP, a: eo(pr(t, .1, .3)) });
  T("택배까지", 64, 410, { size: 100, font: DISP, color: K.red, a: eo(pr(t, .3, .3)) });
  [["버무림", "현장에서 직접 버무려 가져가요", 67000], ["현장 완제품", "다 된 김치를 현장에서 받아요", 69000], ["택배 완제품", "부모님 댁으로 바로 보내요", 72000]].forEach(([n, d, v], i) => {
    const p = eo(pr(t, .45 + i * .22, .5)), y = 520 + i * 300; if (p <= 0) return;
    g.save(); g.translate(lerp(1100, 0, p), 0);
    g.shadowColor = "rgba(60,25,15,.16)"; g.shadowBlur = 24; g.shadowOffsetY = 10; rr(60, y, 960, 260, 32); g.fillStyle = K.paper; g.fill(); g.restore();
    g.save(); g.translate(lerp(1100, 0, p), 0);
    rr(60, y, 18, 260, 9); g.fillStyle = i === 2 ? K.green : K.red; g.fill();
    T(n, 120, y + 92, { size: 52, font: DISP }); T(d, 120, y + 156, { size: 34, w: 500, color: K.sub });
    const nv = lerp(0, v, eio(pr(t, .7 + i * .22, .9)));
    T(won(nv) + "원", 980, y + 120, { size: 92, font: DISP, color: i === 2 ? K.green : K.red, align: "right" });
    T("10kg", 980, y + 196, { size: 32, w: 700, color: K.sub, align: "right" });
    g.restore();
  });
  card("box", 880, 1500, 260, 260, { r: 130, a: eo(pr(t, 1.6, .4)), sc: back(pr(t, 1.6, .5)), border: 8 });
  T("2026 공식 누리집 가격", 64, 1500, { size: 36, w: 700, color: K.sub, a: eo(pr(t, 1.6, .4)) });
}
// 7. 25–30초 · 끝 화면
function s7(t){
  g.fillStyle = K.red; g.fillRect(0, 0, W, H);

  for (let k = 0; k < 9; k++){ g.save(); g.globalAlpha = .1; g.fillStyle = k % 2 ? K.yellow : "#fff";
    g.translate((k * 197 + t * 30) % 1300 - 110, (k * 331) % 1900); g.rotate(k + t * .2); g.beginPath(); g.ellipse(0, 0, 120, 52, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
  const up = (k, d = .4) => eo(pr(t, k, d));
  T("올해 김장은 광주에서", 540, 470, { size: 46, w: 900, color: K.yellow, align: "center", a: up(.1) });
  T("2026 빛고을", 540, 620, { size: 120, font: DISP, color: "#fff", align: "center", a: up(.25), dy: 40 * (1 - up(.25)) });
  T("사랑나눔 김장대전", 540, 760, { size: 120, font: DISP, color: "#fff", align: "center", a: up(.4), dy: 40 * (1 - up(.4)) });
  const cy = 860, cp = up(.6, .5);
  g.save(); g.globalAlpha = cp; g.translate(0, 40 * (1 - cp)); rr(90, cy, 900, 470, 36); g.fillStyle = K.paper; g.fill(); g.restore();
  [["📅", "11.27(금) – 12.13(일)"], ["📍", "광주김치타운 (남구 김치로 60)"], ["💰", "10kg 버무림 67,000원부터"]].forEach(([ic, tx], k) => {
    const a = up(.8 + k * .18), y = cy + 120 + k * 135;
    T(ic, 150, y, { size: 54, a }); T(tx, 236, y, { size: 50, w: 700, a, dy: 16 * (1 - a) });
    if (k < 2){ g.save(); g.globalAlpha = a; g.fillStyle = "#EFE3D6"; g.fillRect(150, y + 48, 780, 3); g.restore(); }
  });
  const pulse = 1 + Math.sin(Math.max(0, t - 1.6) * 6) * .035;
  pill("kimchigwangju.co.kr 예약 중", 540, 1460, { size: 48, bg: K.yellow, fg: K.ink, sc: back(pr(t, 1.4, .5)) * pulse, h: 110, padX: 50 });
  T("주말은 일찍 마감돼요 · 문의 062-676-3601", 540, 1580, { size: 36, w: 700, color: "rgba(255,255,255,.9)", align: "center", a: up(1.7) });
  ["사진(Wikimedia Commons): Caroline Knox, Joseph Steinberg, gwangju kimchi, Junho Jung (CC BY-SA)", "USAG-Humphreys (CC BY 2.0) · Galen Putnam, U.S. Army (퍼블릭 도메인) · 시안용 참고 사진, 이 행사 사진 아님"]
    .forEach((l, k) => T(l, 540, 1720 + k * 34, { size: 21, w: 500, color: "rgba(255,255,255,.7)", align: "center" }));

/* 장면 사이: 색 띠가 비스듬히 쓸고 지나가며 장면이 바뀜 */
const SC = [s1, s2, s3, s4, s5, s6, s7], WIPE = [K.red, K.yellow, K.green, K.red, K.yellow, K.green];
function wipe(t){
  for (let i = 1; i < CUTS.length - 1; i++){ const b = CUTS[i], p = pr(t, b - .28, .56); if (p <= 0 || p >= 1) continue;
    const x = lerp(-W * 1.9, W * 1.1, eio(p)); g.save(); g.fillStyle = WIPE[i - 1];
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + W * 1.2, 0); g.lineTo(x + W * .8, H); g.lineTo(x - W * .4, H); g.closePath(); g.fill();
    g.fillStyle = "rgba(255,255,255,.25)"; g.beginPath(); g.moveTo(x + W * 1.2, 0); g.lineTo(x + W * 1.3, 0); g.lineTo(x + W * .9, H); g.lineTo(x + W * .8, H); g.closePath(); g.fill(); g.restore(); }
}
function frame(t){
  let i = CUTS.findIndex((c, k) => t >= c && t < CUTS[k + 1]); if (i < 0) i = 6;
  g.save(); SC[i](t - CUTS[i]); g.restore(); wipe(t);
}

async function main(){
  say("글꼴·사진 불러오는 중…");
  await Promise.all([`80px ${DISP}`, `500 40px ${BODY}`, `700 40px ${BODY}`, `900 40px ${BODY}`].map(f => document.fonts.load(f, "김장대전가나다0123")));
  await Promise.all(Object.keys(P).map(load));
  let codec = "avc1.640028";
  if (!(await VideoEncoder.isConfigSupported({ codec, width: W, height: H })).supported) codec = "avc1.4d0028";
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: "avc", width: W, height: H, frameRate: FPS }, fastStart: "in-memory" });
  const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => say("오류: " + e.message) });
  enc.configure({ codec, width: W, height: H, bitrate: BR, framerate: FPS, avc: { format: "avc" } });
  const N = DUR * FPS, SHOT = [2.6, 5.8, 10.5, 15.2, 19.6, 24.3, 28.6].map(s => Math.round(s * FPS)), shots = [];
  for (let n = 0; n < N; n++){
    frame(n / FPS);
    if (SHOT.includes(n)) shots.push(await createImageBitmap(cv));
    const vf = new VideoFrame(cv, { timestamp: Math.round(n * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(vf, { keyFrame: n % (FPS * 2) === 0 }); vf.close();
    while (enc.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 5));
    if (n % 30 === 0) say(`영상 만드는 중… ${Math.round(n / N * 100)}%`);
  }
  await enc.flush(); muxer.finalize();
  say("저장 중…");
  await fetch(`/save?name=${encodeURIComponent(NAME + ".mp4")}`, { method: "POST", body: muxer.target.buffer });
  const pv = new OffscreenCanvas(270 * 7 + 8 * 6, 480), pg = pv.getContext("2d"); pg.fillStyle = "#111"; pg.fillRect(0, 0, pv.width, pv.height);
  shots.forEach((b, k) => pg.drawImage(b, k * 278, 0, 270, 480));
  await fetch(`/save?name=${encodeURIComponent(NAME + "_미리보기.jpg")}`, { method: "POST", body: await pv.convertToBlob({ type: "image/jpeg", quality: .88 }) });
  say(`완료 — ${NAME}.mp4 (${(muxer.target.buffer.byteLength / 1048576).toFixed(1)} MB, ${codec})`);
}
main().catch(e => say("오류: " + e.message));
